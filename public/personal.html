      <form id="authForm" class="auth-form"></form>
      <p id="authMessage" class="message hidden" role="status" aria-live="polite"></p>
      <p class="privacy-note">Personaluppgifter sparas på arbetsplatsens server och används för schemaplanering.</p>
    </div>
  </div>

  <div id="appShell" class="hidden">
    <div class="layout">
      <aside class="sidebar">
        <h1 class="logo">Staff Planner</h1>
        <nav class="nav">

        </nav>

      </aside>

      <main class="main">
        <div class="header">
          <h2>Personal</h2>
          <p>Hantera personal</p>
        </div>

        <section class="card">
          <div class="filter-bar"><input id="peopleSearch" type="search" placeholder="Sök namn eller företag" /><select id="availabilityFilter"><option value="">Alla statusar</option><option value="available">Tillgänglig</option><option value="unavailable">Ej tillgänglig</option><option value="off">Ledig</option></select></div>
          <div id="peopleList" class="people-list"></div>
        </section>
